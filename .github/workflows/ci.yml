name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Agent contract present
        run: |
          test -s AGENTS.md
          test "$(wc -l < AGENTS.md)" -gt 20

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Duplicate and dead-code gates
        run: pnpm check:dup && pnpm check:deps

      - name: Structural gates
        run: pnpm check:filesize && pnpm check:todos && pnpm check:agents

      - name: Test with coverage
        run: pnpm test:frontend:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 30

      - name: Upload frontend test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-test-results
          path: test-results/
          retention-days: 30

      - name: Build
        run: pnpm build

      - name: Bundle-size gate
        run: pnpm check:bundle

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Check formatting
        run: ./gradlew formatCheck

      - name: Lint
        run: ./gradlew lint

      - name: Test with coverage
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload backend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/
          retention-days: 30

      - name: Upload backend test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: backend-test-results
          path: backend/build/test-results/
          retention-days: 30

      - name: Build
        run: ./gradlew build -x test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Setup database
        run: |
          python3 -m pip install --requirement scripts/requirements.txt
          python3 scripts/seed-database.py

      - name: Run E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # The HTML and JUnit reports are separate Playwright outputs.
      - name: Upload E2E test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 30

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Working-tree scan via the official image; GitHub secret scanning
      # (enabled on the repo) covers history.
      - name: Scan for committed secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 dir /repo --verbose

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build backend jar
        run: ./gradlew bootJar -x test
        working-directory: ./backend

      - name: Start backend and wait for health
        working-directory: ./backend
        run: |
          java -jar build/libs/*.jar &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health > /dev/null && exit 0
            sleep 2
          done
          echo "Backend did not become healthy in time" && exit 1

      # API scan driven by the served OpenAPI spec: ZAP exercises every
      # documented endpoint against the running backend. -I keeps warnings
      # advisory on first adoption; errors still fail the job.
      - name: Run ZAP API scan against the running backend
        run: |
          docker run --network host --rm -v "$PWD:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:8080/v3/api-docs -f openapi -I -J zap-report.json
          test -f zap-report.json

      - name: Upload ZAP report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: zap-baseline-report
          path: zap-report.json
          retention-days: 30

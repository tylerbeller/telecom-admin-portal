name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # The deployment record at the end of this workflow needs its own scope;
  # contents:write alone returns 403 "Resource not accessible by integration".
  deployments: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build backend jar
        run: ./gradlew bootJar
        working-directory: ./backend

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" backend/build/libs/*.jar --generate-notes --title "${{ github.ref_name }}"

      # Record the deployment so release history is observable from the repo,
      # not just from the tag list. required_contexts is passed explicitly
      # (empty) because otherwise the Deployments API inherits branch
      # protection and rejects the tag ref with 409 "Commit status checks
      # failed" — the tag itself never runs checks.
      - name: Record deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          payload=$(jq -n \
            --arg ref "${{ github.ref_name }}" \
            '{ref: $ref, environment: "release", description: ("Release " + $ref + " published"), required_contexts: []}')
          deployment_id=$(printf '%s' "$payload" \
            | gh api "repos/${{ github.repository }}/deployments" --input - --jq .id)
          gh api "repos/${{ github.repository }}/deployments/${deployment_id}/statuses" \
            -f state=success

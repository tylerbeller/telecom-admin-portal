plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '7.0.4'
	id 'com.github.spotbugs' version '6.1.11'
	id 'pmd'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Telecom administration portal'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
	runtimeOnly 'org.xerial:sqlite-jdbc:3.47.1.0'
	implementation 'org.hibernate.orm:hibernate-community-dialects:7.0.0.Final'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.13.0'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
	
	// Test performance tracking - output timing for each test
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = false
		exceptionFormat = "full"
		// Show test duration
		afterSuite { desc, result ->
			if (!desc.parent) {
				println "\nTest Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
				println "Test Duration: ${(result.endTime - result.startTime) / 1000}s"
			}
		}
	}
	
	// Generate JUnit XML reports for CI integration
	reports {
		junitXml.required = true
		html.required = true
	}
}

// JaCoCo - Code coverage (0.8.14 required for Java 21 support)
jacoco {
	toolVersion = "0.8.14"
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

// Coverage floor: measured baseline is 66% lines / 42% branches. Ratchet the
// floor up as coverage improves; never lower it to make a change pass.
jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.60
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.35
			}
		}
	}
}

// Spotless - Java code formatting
spotless {
	java {
		target 'src/**/*.java'
		eclipse().configFile("${rootDir}/config/eclipse-formatter.xml")
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// SpotBugs - Static analysis and security checks
spotbugs {
	ignoreFailures = false
	showStackTraces = true
	showProgress = true
	effort = 'max'
	reportLevel = 'medium'
	excludeFilter = file("${rootDir}/config/spotbugs-exclude.xml")
}

spotbugsMain {
	reports {
		html.required = true
		xml.required = false
	}
}

spotbugsTest {
	reports {
		html.required = true
		xml.required = false
	}
}

// PMD - Additional code quality and security rules
pmd {
	consoleOutput = true
	ignoreFailures = false
	rulesMinimumPriority = 3
	ruleSetFiles = files("${rootDir}/config/pmd-ruleset.xml")
}

pmdMain {
	source = sourceSets.main.allJava
}

pmdTest {
	enabled = false
}

// Combined lint task
tasks.register('lint') {
	dependsOn 'spotbugsMain', 'pmdMain'
	description = 'Run all static analysis tools'
	group = 'verification'
}

// Format check task
tasks.register('formatCheck') {
	dependsOn 'spotlessCheck'
	description = 'Check code formatting'
	group = 'verification'
}

// Format apply task
tasks.register('format') {
	dependsOn 'spotlessApply'
	description = 'Apply code formatting'
	group = 'verification'
}

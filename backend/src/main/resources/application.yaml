spring:
  application:
    name: telecom-demo-backend
  datasource:
    # WAL lets readers and writers run concurrently, and busy_timeout makes
    # competing writers wait for the lock instead of failing fast with
    # SQLITE_BUSY (both surfaced as HTTP 500s under parallel API load).
    url: jdbc:sqlite:${TELECOM_DB_PATH:app.db}?journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
